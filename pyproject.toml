[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "benchctl"
version = "0.1.0"
description = "CI/CD automation for hardware-in-the-loop test benches"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
winrm = ["pywinrm>=0.4"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
benchctl = "benchctl.cli:main"

[tool.setuptools.packages.find]
include = ["benchctl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["bench: runs against a test bench (real or simulated); needs BENCH_NAME"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
